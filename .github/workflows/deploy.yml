name: Deploy NeuroHeart
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: neuroheart-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: vars.ENABLE_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Update, build, and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          cd /var/www/neuroheart.ai
          git pull --ff-only origin main
          npm ci
          npm run build
          pm2 restart neuroheart --update-env
          curl --fail --silent --output /dev/null http://localhost:3000/gallery
          REMOTE
